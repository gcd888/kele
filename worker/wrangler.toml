name = "kele-worker"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：uni-app H5 构建产物
assets = { directory = "../apps/web/dist/build/h5", binding = "ASSETS", not_found_handling = "none" }

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "kele-db"
database_id = "484e4f67-c9d2-4846-a800-09c036477589"

# 定时任务（免费版账号上限 5 条，已合并为 4 条；触发时刻均为 UTC）
# 0 0 * * *     — UTC 0 点（北京 8 点）：豆瓣爬虫
# 30 0,12 * * * — UTC 0:30 / 12:30：热搜词预热
# 0 3,5 * * *   — UTC 3 点清理过期缓存 / 5 点聚合热搜（代码内按小时分派）
# 15,40 * * * * — 每小时 15 分熔断源探测 / 40 分兜底补检（代码内按分钟分派）
[triggers]
crons = ["0 0 * * *", "30 0,12 * * *", "0 3,5 * * *", "15,40 * * * *"]

[vars]
CORS_ALLOWED_ORIGINS = ""
RATE_LIMIT_PER_MINUTE = "20"

# 敏感变量通过 wrangler secret 设置：
# JWT_SECRET, ADMIN_PASSWORD
